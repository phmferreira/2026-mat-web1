<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo de Id e Classes</title>
    <style>
        p{
            color: blue;
            text-align: right;
        }
        #destaque{
            color: red;
            font-size: 1.5rem;
            text-align: center;
        }
        .padrao-paragrafo{
            color: black;
            text-align: left;
        }
    </style>
</head>
<body>
    <p id="destaque">Primeiro parágrafo</p>
    <p id="destaque" class="padrao-paragrafo">Segundo parágrafo</p>
    <p style="color: chartreuse;" id="destaque" class="padrao-paragrafo">Terceiro parágrafo</p>
    <p class="padrao-paragrafo">Quarto parágrafo</p>
    <p>Quinto parágrafo</p>
</body>
</html>
