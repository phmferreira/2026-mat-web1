<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabela</title>
    <style>
        table{
            border: 1px solid black;
            border-collapse: collapse;
        }
        th, td{
            border: 1px solid black;
            padding-left: 15px;
            padding-right: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead><tr><th>Aluno</th>
                   <th>Curso</th>
                   <th>Ano</th></tr>
        </thead>
        <tbody><tr><td>Maria</td>
                   <td>Informática</td>
                   <td>Ano 2</td></tr>
        </tbody>
    </table>
</body>
</html>
