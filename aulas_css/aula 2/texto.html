<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Texto Escondido</title>
    <style>
        span{
            display: none;
            background-color: yellow;
            padding: 20px;
        }
        div:hover span{
            display: block;
        }
    </style>
</head>
<body>
    <div>
        Passe o mouse aqui!
        <span>
            Mensagem escondida!!!
        </span>
    </div>
</body>
</html>
