<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Selecão Elementos</title>
    <style>
        /* ol, ul{
            color: blue;
        } */
        /* ul li{
            color: blue;
        } */
        ul > li {
            color: blue;
        }
    </style>
</head>
<body>
    <ol>
        <li>Software</li>
        <li>Hardware</li>
        <li>Dados</li>
        <li>Usuário</li>
    </ol>
    <ul>
        <li>Entrada</li>
        <li>Processamento</li>
        <ol>
            <li>Memória</li>
            <li>Processador</li>
        </ol>
        <li>Saída</li>
    </ul>
</body>
</html>
