<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Exemplo Botão</title>
    <style>
        button{
            height: 50px;
            width: 200px;
            font-size: 1.5rem;
            background-color: green;
            transition-duration: 500ms;
        }
        button:hover{
            background-color: orange;
            box-shadow: 0 12px 16px 0 rgba(0,0,0, 0.24),
                0 17px 50px 0 rgba(0,0,0, 0.19);
        }
    </style>
</head>
<body>
    <button>Clique aqui!</button>
</body>
</html>
