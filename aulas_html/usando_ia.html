<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário Vale do Piancó</title>
</head>
<body>

    <h2>Selecione uma cidade do Vale do Piancó</h2>

    <form>
        <label for="cidade">Escolha a cidade:</label>
        <select name="cidade" id="cidade" required>
            <option value="" disabled selected>Selecione uma opção...</option>
            <option value="aguiar">Aguiar</option>
            <option value="boa_ventura">Boa Ventura</option>
            <option value="conceicao">Conceição</option>
            <option value="coremas">Coremas</option>
            <option value="curral_velho">Curral Velho</option>
            <option value="diamante">Diamante</option>
            <option value="ibiara">Ibiara</option>
            <option value="igaracy">Igaracy</option>
            <option value="itaporanga">Itaporanga</option>
            <option value="nova_olinda">Nova Olinda</option>
            <option value="olho_dagua">Olho d'Água</option>
            <option value="pianco">Piancó</option>
            <option value="pedra_branca">Pedra Branca</option>
            <option value="santana_dos_garrotes">Santana dos Garrotes</option>
            <option value="santa_ines">Santa Inês</option>
            <option value="sao_jose_de_caiana">São José de Caiana</option>
            <option value="serra_grande">Serra Grande</option>
        </select>

        <br><br>

        <input type="submit" value="Enviar">
    </form>

</body>
</html>
